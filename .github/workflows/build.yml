name: Build MarioISN

# Only runs for changes that can actually affect the compiled game (code,
# assets, build scripts/config). Docs-only or release-metadata-only pushes
# (README, CHANGELOG, .releaserc.json...) don't trigger a build -- and since
# release.yml only fires via workflow_run off *this* workflow, they don't
# trigger a release check either. That's fine: those commit types (docs/
# chore) don't bump the version anyway, and any pending feat/fix ships on the
# next push that does touch a build-relevant path.
on:
  push:
    paths: &build-relevant-paths
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'ressources/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.github/workflows/build.yml'
  pull_request:
    paths: *build-relevant-paths
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      # ubuntu-latest (24.04, glibc 2.39) is deliberately NOT used here: the
      # bundled .so files link against whatever glibc symbols are available
      # on the build machine, and glibc is forward-compatible only (an
      # older-glibc build runs fine on newer systems, never the reverse). A
      # user on Ubuntu 22.04/Debian 12-class systems (glibc ~2.35-2.36)
      # couldn't run a 24.04-built artifact -- pinning to 22.04 targets the
      # oldest glibc still reasonable to support instead of whatever
      # "latest" happens to resolve to.
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------
      # Dependencies per OS
      # ---------------------
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja sdl2 sdl2_image sdl2_mixer

      # GitHub's macos-latest runners are Apple Silicon; there is no reliable
      # native Intel runner anymore. clang cross-compiles to x86_64 directly
      # (no Rosetta needed for that part), but Homebrew's arm64 prefix
      # (/opt/homebrew) only ships arm64 SDL2 libs, so a second, x86_64
      # Homebrew installed under Rosetta at /usr/local provides those.
      - name: Install Rosetta 2 (macOS)
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Install Intel SDL2 deps via Rosetta Homebrew (macOS)
        if: runner.os == 'macOS'
        env:
          NONINTERACTIVE: "1"
        run: |
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          arch -x86_64 /usr/local/bin/brew install sdl2 sdl2_image sdl2_mixer

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config patchelf \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev

      # vcpkg's default binary cache (enabled automatically, no extra config)
      # lives here; restoring it across runs skips recompiling
      # SDL2/SDL2_image/SDL2_mixer from source every time (~2 min saved).
      # Keyed on run_id so every run saves a fresh entry (cache keys are
      # immutable), and restored via the shared prefix so each run picks up
      # the most recent previous cache.
      - name: Cache vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-windows-x64-sdl2-${{ github.run_id }}
          restore-keys: |
            vcpkg-archives-windows-x64-sdl2-

      - name: Install deps (Windows via vcpkg)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install sdl2 sdl2-image sdl2-mixer --triplet x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"

      # ---------------------
      # Configure & Build
      # ---------------------
      - name: Configure & Build (macOS)
        if: runner.os == 'macOS'
        run: |
          make prod-arm

      - name: Configure & Build (macOS Intel via Rosetta)
        if: runner.os == 'macOS'
        run: |
          make prod-intel

      - name: Configure & Build (Linux)
        if: runner.os == 'Linux'
        run: |
          make prod-linux

      - name: Configure & Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build-win -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="${CMAKE_TOOLCHAIN_FILE}"
          cmake --build build-win --config Release

      # ---------------------
      # Unit tests (SDL-free domain logic, see src/domain/)
      # ---------------------
      - name: Run unit tests (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build-arm --output-on-failure

      - name: Run unit tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build-linux --output-on-failure

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build-win -C Release --output-on-failure

      # ---------------------
      # macOS-specific post steps
      # ---------------------
      - name: Ad-hoc sign app (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - build-arm/mario_isn.app
          codesign --force --deep --sign - build-intel/mario_isn.app

      # -y (store symlinks as symlinks) is required: Homebrew's bundled
      # dylibs are versioned via symlinks (e.g. libfoo.1.dylib ->
      # libfoo.1.2.3.dylib), and the ad-hoc code signature seals them as
      # symlinks. Plain `zip -r` dereferences symlinks by default, so
      # unzipping produced regular-file duplicates instead -- silently
      # invalidating the signature ("a sealed resource is missing or
      # invalid"). That's what turned into the hard Gatekeeper "app is
      # damaged, move to Trash" error users hit on download (distinct from,
      # and with no workaround unlike, the expected/documented "unidentified
      # developer" prompt for a non-notarized app).
      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build-arm
          zip -ry MarioISN-macos-arm.zip mario_isn.app
          cd ../build-intel
          zip -ry MarioISN-macos-intel.zip mario_isn.app

      # Round-trips the exact zip that gets uploaded and verifies the code
      # signature survives it -- this is what would have caught the
      # dereferenced-symlinks regression (zip missing -y) that shipped in
      # 1.2.0: the app built and signed fine, only the packaged artifact
      # was broken, so nothing before this step would have noticed.
      # Round-trips the exact zip that gets uploaded, verifies the signature
      # survives it, then actually launches the app briefly. The launch
      # check is what would have caught the sdl2-compat/libSDL3 regression:
      # sdl2-compat dlopen()s libSDL3.dylib at runtime instead of linking it,
      # so it's invisible to fixup_bundle and to a plain codesign check --
      # the signature was perfectly valid, the app just aborted on launch.
      - name: Verify code signature and smoke-test the zip round-trip (macOS)
        if: runner.os == 'macOS'
        run: |
          for arch in arm intel; do
            rm -rf /tmp/verify-$arch && mkdir -p /tmp/verify-$arch
            unzip -q build-$arch/MarioISN-macos-$arch.zip -d /tmp/verify-$arch
            codesign --verify --deep --strict --verbose=2 /tmp/verify-$arch/mario_isn.app

            if [ "$arch" = "intel" ]; then
              RUNNER="arch -x86_64"
            else
              RUNNER=""
            fi
            $RUNNER /tmp/verify-$arch/mario_isn.app/Contents/MacOS/mario_isn &
            pid=$!
            sleep 4
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"
              echo "mario_isn ($arch) exited early with code $? instead of staying up -- see output above"
              exit 1
            fi
            echo "mario_isn ($arch) stayed up for 4s -- bundled libs (including libSDL3) resolved correctly"
            kill -9 "$pid"
            wait "$pid" 2>/dev/null || true
          done

      # ---------------------
      # Linux packaging
      # ---------------------
      # Packages as a single-file AppImage instead of a tar.gz -- players get
      # one MarioISN-x86_64.AppImage to chmod +x and run, not an archive to
      # extract into a folder full of loose files and .so's. build-linux/'s
      # existing flat layout (mario_isn + img/musique/bin/lib alongside it,
      # already bundled and rpath'd by bundle_libs_linux.sh) becomes usr/bin/
      # verbatim -- SDL_GetBasePath() resolves assets relative to whatever
      # directory the *actual* binary ends up running from (see src/path.c),
      # so nothing about that resolution needs to change.
      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          APPDIR=MarioISN.AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp -r build-linux/mario_isn build-linux/img build-linux/musique build-linux/bin build-linux/lib "$APPDIR/usr/bin/"
          install -m 755 packaging/linux/AppRun "$APPDIR/AppRun"
          cp packaging/linux/mario_isn.desktop "$APPDIR/mario_isn.desktop"
          cp packaging/linux/mario_isn.png "$APPDIR/mario_isn.png"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # --appimage-extract-and-run's non-FUSE extraction mode: GitHub's
          # hosted runners have no FUSE, so running the tool (itself an
          # AppImage) directly would fail.
          ./appimagetool --appimage-extract >/dev/null
          ARCH=x86_64 squashfs-root/AppRun "$APPDIR" MarioISN-x86_64.AppImage

      # Builds a proper installer (Start Menu/Desktop shortcuts, uninstaller)
      # instead of a raw zip -- players get one MarioISN-windows-setup.exe to
      # download and run, not a folder full of DLLs to extract and manage.
      # domain_tests.exe (unit test binary, builds into this same Release
      # dir as mario_isn.exe) is deleted first so it doesn't leak into the
      # installer payload.
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # MSYS2_ARG_CONV_EXCL=* is required: Git Bash's MSYS layer auto-
        # converts any argument that *looks* like a POSIX path (anything
        # starting with /) into a Windows path before exec'ing the target
        # program. /DVERSION=1.2.6 matches that heuristic and was silently
        # getting mangled into "C:/Program Files/Git/DVERSION=1.2.6" --
        # makensis then tried to open THAT as the script file and failed.
        # Excluding all args from conversion (there are no real POSIX paths
        # among makensis's arguments here; PAYLOAD_DIR/ICON_PATH are already
        # pre-converted via cygpath) sidesteps it entirely.
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          rm -f build-win/Release/domain_tests.exe
          # NSIS isn't part of the windows-latest runner's default image.
          choco install nsis -y --no-progress
          VERSION=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' CMakeLists.txt | head -1 | tr -d '"')
          PAYLOAD_DIR_WIN=$(cygpath -w "$PWD/build-win/Release")
          ICON_PATH_WIN=$(cygpath -w "$PWD/packaging/windows/mario_isn.ico")
          OUTFILE_WIN=$(cygpath -w "$PWD/MarioISN-windows-setup.exe")
          "/c/Program Files (x86)/NSIS/makensis.exe" \
            "/DVERSION=$VERSION" "/DPAYLOAD_DIR=$PAYLOAD_DIR_WIN" "/DICON_PATH=$ICON_PATH_WIN" \
            "/DOUTFILE=$OUTFILE_WIN" \
            packaging/windows/installer.nsi
          ls -la MarioISN-windows-setup.exe

      # ---------------------
      # Upload artifacts
      # ---------------------
      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MarioISN-macos-arm
          path: build-arm/MarioISN-macos-arm.zip

      - name: Upload artifact (macOS Intel)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MarioISN-macos-intel
          path: build-intel/MarioISN-macos-intel.zip

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: MarioISN-linux
          path: MarioISN-x86_64.AppImage

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MarioISN-windows
          path: MarioISN-windows-setup.exe

  smoke-test-linux:
    name: Linux smoke test (no system SDL2)
    needs: build
    # Same version as the build job on purpose: glibc is forward-compatible
    # only, so the meaningful check is "does it run on the oldest glibc we
    # target" (22.04), not "does it run on whatever happens to be newest" --
    # the latter would pass trivially and never catch a version mismatch
    # like the one that shipped in 1.2.5 (built on 24.04, glibc 2.39;
    # smoke-tested on 24.04 too, so nothing caught that real users on
    # 22.04-class systems couldn't run it).
    runs-on: ubuntu-22.04
    # Safety net: a stray hang here (this job already hit one -- an
    # interactive apt-get prompt with no TTY, see the fix below) should fail
    # fast instead of silently burning CI minutes for hours.
    timeout-minutes: 10

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: MarioISN-linux
          path: dist

      # No container/Docker image here on purpose: this job already runs on
      # its own fresh ubuntu-latest VM, which has never had libsdl2-dev
      # installed (that only happens in the separate "Build on ubuntu-latest"
      # job, on its own runner) -- so it's already a clean "no system SDL2"
      # environment without needing a nested container pull. An earlier
      # version used `container: ubuntu:24.04` for this and the job hung for
      # 10+ minutes on every run, most likely stuck on an anonymous Docker
      # Hub image pull (a well-known rate-limit trap for GitHub-hosted
      # runner IPs) -- dropping the container sidesteps that entirely.
      - name: Confirm the runner has no system SDL2
        run: |
          ! ldconfig -p | grep -qi 'libsdl2'

      - name: Install a virtual display only (no SDL2 packages)
        # DEBIAN_FRONTEND=noninteractive: installing xvfb pulls in tzdata,
        # which otherwise blocks on an interactive timezone prompt with no
        # TTY to answer it.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Make the AppImage executable
        run: chmod +x dist/MarioISN-x86_64.AppImage

      - name: Run the game headlessly for a few seconds
        env:
          # Skip straight into gameplay (see src/main.c) instead of sitting
          # at the menu waiting for a click that headless CI can never send.
          # Previously this step relied on a real bug for the same effect
          # (SIGTERM-as-SDL_QUIT fell through into gameplay because the
          # menu's own quit handling was broken) -- now that main.c's menu
          # loop and quit handling are both fixed (see PLAN.md J13), SIGTERM
          # at the menu correctly exits the app instead, so that trick no
          # longer works and this explicit, intentional hook replaces it.
          MARIO_ISN_AUTOPLAY: "1"
        run: |
          cd dist
          set +e
          # --appimage-extract-and-run: this runner has no FUSE (same as the
          # build job's appimagetool step), so the AppImage can't mount
          # itself the normal way -- this flag extracts to a temp dir and
          # execs the real binary directly instead, transparently to the
          # timeout/signal handling below.
          #
          # --kill-after is a safety net, not strictly required anymore: the
          # game's own gameplay-loop SDL_QUIT handling (deplacement_joueur.c)
          # already exits cleanly on a plain SIGTERM. Kept in case that ever
          # regresses, so this step fails fast instead of hanging again.
          xvfb-run --auto-servernum timeout --kill-after=5 5 \
            ./MarioISN-x86_64.AppImage --appimage-extract-and-run
          code=$?
          set -e
          # `timeout` exits 124 whenever it had to signal the still-running
          # process itself, whether the process then exits gracefully on
          # that first SIGTERM or needs the --kill-after SIGKILL escalation
          # -- i.e. the game made it into gameplay and stayed up until the
          # timeout, either way. 137 (xvfb-run propagating a raw SIGKILL
          # termination status) is also accepted in case the escalation path
          # is ever needed again. Any other exit code means it died on its
          # own within the window (most likely a missing bundled shared
          # library).
          if [ "$code" -ne 124 ] && [ "$code" -ne 137 ]; then
            echo "Game exited early with code $code instead of staying up -- see output above"
            exit 1
          fi
          echo "Game stayed up for 5s -- bundled libs resolved correctly"

      # Regression test for the leak fixed in J10 (see PLAN.md): several
      # hot render-path functions reloaded a fixed sprite from disk via
      # create_texture() on every call instead of caching it, and
      # SDL_DestroyTexture was never called anywhere in the codebase.
      # Reproduced locally, it leaked ~2.15GB of RSS in 17s of gameplay.
      # Launches straight into gameplay via MARIO_ISN_AUTOPLAY (see main.c
      # and the step above -- no input automation needed beyond that,
      # afficher_mechant()/animation()/systeme_vie()/coinAff() all run every
      # frame regardless of input), then samples RSS before/after via `ps`
      # and fails if it grew by more than a threshold that's a wide margin
      # above what legitimate one-time sprite caching should ever need, and
      # far below what the real regression produced.
      - name: Leak regression test (RSS should stay flat during gameplay)
        env:
          MARIO_ISN_AUTOPLAY: "1"
        run: |
          cd dist
          xvfb-run --auto-servernum bash -c '
            set -e
            # Kill any mario_isn orphaned by the previous step: its
            # --kill-after=5 targets the AppImage --appimage-extract-and-run
            # supervisor, which forks (not exec-replaces) the real binary,
            # so the supervisor dying does not guarantee the actual game
            # process went with it. Without this, pgrep -n below could still
            # pick the fresh process correctly, but a leftover instance
            # would pollute this steps output/process list for no reason.
            pkill -9 -x mario_isn 2>/dev/null || true
            sleep 1

            ./MarioISN-x86_64.AppImage --appimage-extract-and-run &
            sleep 3
            # $! here is that same small fork supervisor, not the actual
            # SDL process -- confirmed empirically in CI (its RSS was ~1MB,
            # and it disappeared on its own while a separate mario_isn
            # process kept logging independently). Find the real process by
            # name instead; -n picks the most-recently-started match so a
            # stray leftover cannot be mistaken for the fresh one.
            PID=$(pgrep -n -x mario_isn || true)
            if [ -z "$PID" ]; then
              echo "mario_isn process not found after startup -- crashed on launch?"
              exit 1
            fi
            RSS_BEFORE=$(ps -o rss= -p "$PID" 2>/dev/null | tr -d " ")
            if [ -z "$RSS_BEFORE" ]; then
              echo "Process $PID not found before gameplay -- crashed on launch?"
              exit 1
            fi
            echo "RSS before gameplay: ${RSS_BEFORE} KB"

            sleep 10
            RSS_AFTER=$(ps -o rss= -p "$PID" 2>/dev/null | tr -d " ")
            kill -KILL "$PID" 2>/dev/null || true
            if [ -z "$RSS_AFTER" ]; then
              echo "Process $PID not found after gameplay -- crashed during play?"
              exit 1
            fi
            echo "RSS after ~10s of gameplay: ${RSS_AFTER} KB"

            GROWTH=$((RSS_AFTER - RSS_BEFORE))
            echo "RSS growth during gameplay: ${GROWTH} KB"
            if [ "$GROWTH" -gt 153600 ]; then
              echo "Memory grew by ${GROWTH} KB in ~10s of gameplay -- likely a texture/resource leak (see PLAN.md J10)"
              exit 1
            fi
          '
