name: Release
on:
  workflow_run:
    workflows: ["Build MarioISN"]  # nom du workflow build
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read  # nécessaire pour télécharger les artefacts d’un autre workflow run

jobs:
  release:
    # build.yml now runs on every branch/PR (for local testing), but a
    # release must only ever be cut from main.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # indispensable pour récupérer tous les tags

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

       # Télécharge les artefacts du run qui vient de finir
      - name: Download artifacts from build run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          path: dist
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
