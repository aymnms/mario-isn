name: Build MarioISN

# Only runs for changes that can actually affect the compiled game (code,
# assets, build scripts/config). Docs-only or release-metadata-only pushes
# (README, CHANGELOG, .releaserc.json...) don't trigger a build -- and since
# release.yml only fires via workflow_run off *this* workflow, they don't
# trigger a release check either. That's fine: those commit types (docs/
# chore) don't bump the version anyway, and any pending feat/fix ships on the
# next push that does touch a build-relevant path.
on:
  push:
    paths: &build-relevant-paths
      - 'src/**'
      - 'include/**'
      - 'ressources/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.github/workflows/build.yml'
  pull_request:
    paths: *build-relevant-paths
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------
      # Dependencies per OS
      # ---------------------
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja sdl2 sdl2_image sdl2_mixer

      # GitHub's macos-latest runners are Apple Silicon; there is no reliable
      # native Intel runner anymore. clang cross-compiles to x86_64 directly
      # (no Rosetta needed for that part), but Homebrew's arm64 prefix
      # (/opt/homebrew) only ships arm64 SDL2 libs, so a second, x86_64
      # Homebrew installed under Rosetta at /usr/local provides those.
      - name: Install Rosetta 2 (macOS)
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Install Intel SDL2 deps via Rosetta Homebrew (macOS)
        if: runner.os == 'macOS'
        env:
          NONINTERACTIVE: "1"
        run: |
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          arch -x86_64 /usr/local/bin/brew install sdl2 sdl2_image sdl2_mixer

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config patchelf \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev

      # vcpkg's default binary cache (enabled automatically, no extra config)
      # lives here; restoring it across runs skips recompiling
      # SDL2/SDL2_image/SDL2_mixer from source every time (~2 min saved).
      # Keyed on run_id so every run saves a fresh entry (cache keys are
      # immutable), and restored via the shared prefix so each run picks up
      # the most recent previous cache.
      - name: Cache vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-windows-x64-sdl2-${{ github.run_id }}
          restore-keys: |
            vcpkg-archives-windows-x64-sdl2-

      - name: Install deps (Windows via vcpkg)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install sdl2 sdl2-image sdl2-mixer --triplet x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"

      # ---------------------
      # Configure & Build
      # ---------------------
      - name: Configure & Build (macOS)
        if: runner.os == 'macOS'
        run: |
          make prod-arm

      - name: Configure & Build (macOS Intel via Rosetta)
        if: runner.os == 'macOS'
        run: |
          make prod-intel

      - name: Configure & Build (Linux)
        if: runner.os == 'Linux'
        run: |
          make prod-linux

      - name: Configure & Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build-win -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="${CMAKE_TOOLCHAIN_FILE}"
          cmake --build build-win --config Release

      # ---------------------
      # macOS-specific post steps
      # ---------------------
      - name: Ad-hoc sign app (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - build-arm/mario_isn.app
          codesign --force --deep --sign - build-intel/mario_isn.app

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build-arm
          zip -r MarioISN-macos-arm.zip mario_isn.app
          cd ../build-intel
          zip -r MarioISN-macos-intel.zip mario_isn.app

      # ---------------------
      # Linux packaging
      # ---------------------
      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build-linux
          tar -czf MarioISN-linux.tar.gz mario_isn img musique bin lib

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd build-win/Release
          7z a ../MarioISN-windows.zip .

      # ---------------------
      # Upload artifacts
      # ---------------------
      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MarioISN-macos-arm
          path: build-arm/MarioISN-macos-arm.zip

      - name: Upload artifact (macOS Intel)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MarioISN-macos-intel
          path: build-intel/MarioISN-macos-intel.zip

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: MarioISN-linux
          path: build-linux/MarioISN-linux.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MarioISN-windows
          path: build-win/MarioISN-windows.zip
